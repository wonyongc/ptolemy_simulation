schema_version: "1.0"
simulator: cst
units:
  length: m
  voltage: V
  time: ns
boundary: open
background:
  xy_mm: 100
  zmin_mm: 100
  zmax_mm: 100
mesh:
  step_mm: 1
  buffer_mm: 0
max_time_steps: 100000000
fields:
  magnetrun: false
  computeE: true
  computeB: false
  importE: false
  importB: true
  b_field_file: "/scratch/gpfs/CGTULLY/wonyongc/ptolemy/magnet_runs/lngs_3perm_asym.cst"
  e_field_file: ""
tracking:
  method: Hexahedral
  sim_time_ns: 5
  iterations: 1000
  neglect_space_charge: false
  neglect_PEC_charging: true
  threads: 1024
  distributed: false
  traj_sampling:
    freq: 100
    per_mesh: 100
    save: false
solvers:
  e_static_accuracy: "1e-12"
  m_static_accuracy: "1e-12"
  max_threads: 48
  max_cpu_devices: 4
monitors:
  - name: monitor1
    planes: 51
    normal: z
    xlim: [-0.055, 0.055]
    ylim: [-0.05, 0.05]
    zlim: [-1.5, -1.0]
  - name: monitor2
    planes: 51
    normal: z
    xlim: [-0.055, 0.055]
    ylim: [-0.05, 0.05]
    zlim: [-1.0, -0.5]
  - name: monitor3
    planes: 51
    normal: z
    xlim: [-0.055, 0.055]
    ylim: [-0.05, 0.05]
    zlim: [-0.5, 0.0]
  - name: monitor4
    planes: 51
    normal: z
    xlim: [-0.055, 0.055]
    ylim: [-0.05, 0.05]
    zlim: [0.0, 0.5]
  - name: monitor5
    planes: 51
    normal: z
    xlim: [-0.055, 0.055]
    ylim: [-0.05, 0.05]
    zlim: [0.5, 1.0]
  - name: monitor6
    planes: 51
    normal: z
    xlim: [-0.055, 0.055]
    ylim: [-0.05, 0.05]
    zlim: [1.0, 1.5]
exclusions:
  solids:
    - "solid$magnet:lngs_magnet"
    - "solid$target:pm_target"
  coils:
    - "coil$coil1"
    - "coil$coil1_1"
postprocess:
  monitor_names: ["monitor1", "monitor2", "monitor3", "monitor4", "monitor5", "monitor6"]
  output_dir: results
  transmission_filename: transmission.txt
  pitch_filename: pitchanalysis.txt
  trajectory_filename: trajectories.csv
  field_exports:
    output_dir: results/fields
    e_field_result: field_se_e
    potential_result: field_se_phi
    b_field_result: field_0_0_import_predefined_plot
    regions:
      - name: wide
        x: {start: -0.053, stop: 0.053, step: 0.0005}
        y: {start: -0.0335, stop: 0.0335, step: 0.0005}
        z: {start: -0.4, stop: 0.468, step: 0.0005}
        export_b: true
        export_e: true
        export_potential: true
toggles:
  exclude_magnet_when_magnetrun_false: true
  run_solver_after_build: true
  export_transmission: true
  export_pitch_analysis: true
  export_trajectories: false
  export_field_maps: false
