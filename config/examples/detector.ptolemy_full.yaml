schema_version: "1.0"
experiment:
  name: ptolemy_full_detector
constants:
  injection_bounce: -200
  inj_base_ch0: -2500
  inj_base_ch1: -2400
  inj_base_ch2: -2300
  inj_base_ch3: -1700
  inj_base_ch4: -1000
  vscale5: 50544.978810838584
  vscale4: 52566.77796327213
  vscale3: 54588.577115705666
  vscale2: 66719.37203030693
  vscale1: 80871.96609734173
  offset: 0.10
  lambda_target: 0.25
  lambda_post: 0.60
  z0_filter: -1.409275
  z_accel_end_pos: -1.009275
  z_accel_end_neg: -0.649275
  z_lambda_start: -0.409275
profiles:
  bx:
    file: data/lngs_3perm_asym_Bx.txt
    normalize: true
geometry:
  - id: lngs_magnet
    type: lngs_magnet
    component: magnet

  - id: target
    type: target
    component: target
    center_x_m: -0.253
    center_z_m: -1.302
    rotation_deg: 74.07
    magnet_radius_m: 0.01
    magnet_height_m: 0.005
    thickness_m: 0.001
    remanence_T: 1.5255
    voltage_inner: 18600
    voltage_catcher: 19000

  - id: target_backplate_cutout
    type: target_backplate_cutout
    component: target
    catchz_m: -1.302
    filter_dimension_half_x_m: 0.055
    filter_dimension_half_y_m: 0.060
    electrode_thickness_m: 0.001
    bring_cutout_y_m: 0.020
    bring_cutout_z_m: -1.102

  - id: parallel_drain
    type: parallel_drain
    component: parallel_drain
    ellipse_center:
      x_m: 0.0
      z_m: -1.302
    axes_m:
      a_m: 0.2482
      b_m: 0.2248
    offsets_m:
      inner: 0.04
      outer: 0.03
    y_at_plate_m: 0.020
    face_number: 11
    angles_deg: [15, 30, 45, 60, 90]
    potentials: [15000, 12000, 8000, 5000]
    angle_gap_deg: 1
    electrode_thickness_m: 0.001
    x_half_m: 0.055
    y_half_m: 0.020
    cutout_z_span_m: [-1.802, -1.302]

  - id: filter_injection
    type: filter_element
    component: filter_injection
    z_span_m: [-1.551275, -1.421275]
    bounce_xpos_z_span_m: [-1.551275, -1.421275]
    bounce_xneg_z_span_m: [-1.491275, -1.421275]
    channel_ypos_z_span_m: [-1.551275, -1.421275]
    channel_yneg_z_span_m: [-1.551275, -1.421275]
    x_half_m: 0.055
    y_half_m: 0.020
    pcb_thickness_m: 0.001
    electrode_thickness_m: 0.0
    electrode_len_m: 0.13
    electrode_gap_m: 0.0
    end_gap_m: 0.004
    channels_x: 5
    channel_width_ratios: [1, 1, 1, 1, 1]
    channel_gap_m: 0.001
    corner_gap_m: 0.001
    voltages:
      bounce_xpos: "injection_bounce"
      bounce_xneg: "injection_bounce"
      channels_mode: asymmetric
      pos_y_channels: ["2500", "2600", "2700", "3300", "4000"]
      neg_y_channels: ["-2500", "-2400", "-2300", "-1700", "-1000"]

  - id: filter_stage1
    type: filter_element
    component: filter_stage1
    z_span_m: [-1.417275, 0.642725]
    bounce_xpos_z_span_m: [-1.417275, 0.578725]
    bounce_xneg_z_span_m: [-1.417275, 0.578725]
    channel_ypos_z_span_m: [-1.417275, 0.642725]
    channel_yneg_z_span_m: [-1.417275, 0.642725]
    x_half_m: 0.055
    y_half_m: 0.020
    pcb_thickness_m: 0.001
    electrode_thickness_m: 0.0
    electrode_len_m: 0.016
    electrode_gap_m: 0.004
    end_gap_m: 0.0
    channels_x: 5
    channel_width_ratios: [1, 1, 1, 1, 1]
    channel_gap_m: 0.001
    corner_gap_m: 0.001
    voltages:
      bounce_xpos: "injection_bounce if z < z_accel_end_neg else injection_bounce*(bx_norm(z)**0.5)"
      bounce_xneg: "injection_bounce if z < z_accel_end_neg else injection_bounce*(bx_norm(z)**0.5)"
      channels_mode: asymmetric
      pos_y_channels:
        - "vscale5 * (bx_norm(z)**(1 + (lambda_target-1)*max(0,min(1,(z - z0_filter)/(z_accel_end_pos - z0_filter))))) if z < z_accel_end_pos else (vscale5 * (bx_norm(z)**lambda_target)) if z < z_lambda_start else (vscale5 * (bx_norm(z)**lambda_post))"
        - "vscale4 * (bx_norm(z)**(1 + (lambda_target-1)*max(0,min(1,(z - z0_filter)/(z_accel_end_pos - z0_filter))))) if z < z_accel_end_pos else (vscale4 * (bx_norm(z)**lambda_target)) if z < z_lambda_start else (vscale4 * (bx_norm(z)**lambda_post))"
        - "vscale3 * (bx_norm(z)**(1 + (lambda_target-1)*max(0,min(1,(z - z0_filter)/(z_accel_end_pos - z0_filter))))) if z < z_accel_end_pos else (vscale3 * (bx_norm(z)**lambda_target)) if z < z_lambda_start else (vscale3 * (bx_norm(z)**lambda_post))"
        - "vscale2 * (bx_norm(z)**(1 + (lambda_target-1)*max(0,min(1,(z - z0_filter)/(z_accel_end_pos - z0_filter))))) if z < z_accel_end_pos else (vscale2 * (bx_norm(z)**lambda_target)) if z < z_lambda_start else (vscale2 * (bx_norm(z)**lambda_post))"
        - "vscale1 * (bx_norm(z)**(1 + (lambda_target-1)*max(0,min(1,(z - z0_filter)/(z_accel_end_pos - z0_filter))))) if z < z_accel_end_pos else (vscale1 * (bx_norm(z)**lambda_target)) if z < z_lambda_start else (vscale1 * (bx_norm(z)**lambda_post))"
      neg_y_channels:
        - "inj_base_ch0 + ((-offset*vscale5*bx_norm(z)) - inj_base_ch0)*max(0,min(1,(z - z0_filter)/(z_accel_end_neg - z0_filter))) if z < z_accel_end_neg else (-offset*vscale5*bx_norm(z)) if z < z_lambda_start else (-offset*vscale5*(bx_norm(z)**lambda_post))"
        - "inj_base_ch1 + ((-offset*vscale4*bx_norm(z)) - inj_base_ch1)*max(0,min(1,(z - z0_filter)/(z_accel_end_neg - z0_filter))) if z < z_accel_end_neg else (-offset*vscale4*bx_norm(z)) if z < z_lambda_start else (-offset*vscale4*(bx_norm(z)**lambda_post))"
        - "inj_base_ch2 + ((-offset*vscale3*bx_norm(z)) - inj_base_ch2)*max(0,min(1,(z - z0_filter)/(z_accel_end_neg - z0_filter))) if z < z_accel_end_neg else (-offset*vscale3*bx_norm(z)) if z < z_lambda_start else (-offset*vscale3*(bx_norm(z)**lambda_post))"
        - "inj_base_ch3 + ((-offset*vscale2*bx_norm(z)) - inj_base_ch3)*max(0,min(1,(z - z0_filter)/(z_accel_end_neg - z0_filter))) if z < z_accel_end_neg else (-offset*vscale2*bx_norm(z)) if z < z_lambda_start else (-offset*vscale2*(bx_norm(z)**lambda_post))"
        - "inj_base_ch4 + ((-offset*vscale1*bx_norm(z)) - inj_base_ch4)*max(0,min(1,(z - z0_filter)/(z_accel_end_neg - z0_filter))) if z < z_accel_end_neg else (-offset*vscale1*bx_norm(z)) if z < z_lambda_start else (-offset*vscale1*(bx_norm(z)**lambda_post))"

  - id: filter_stage2
    type: filter_element
    component: filter_stage2
    z_span_m: [0.582725, 0.842725]
    bounce_xpos_z_span_m: [0.582725, 0.778725]
    bounce_xneg_z_span_m: [0.582725, 0.778725]
    channel_ypos_z_span_m: [0.582725, 0.842725]
    channel_yneg_z_span_m: [0.582725, 0.842725]
    x_half_m: 0.055
    y_half_m: 0.030
    pcb_thickness_m: 0.001
    electrode_thickness_m: 0.0
    electrode_len_m: 0.016
    electrode_gap_m: 0.004
    end_gap_m: 0.0
    channels_x: 5
    channel_width_ratios: [1, 1, 1, 1, 1]
    channel_gap_m: 0.001
    corner_gap_m: 0.001
    voltages:
      bounce_xpos: "injection_bounce*(bx_norm(z)**0.5)"
      bounce_xneg: "injection_bounce*(bx_norm(z)**0.5)"
      channels_mode: uniform
      pos_y: "vscale3*(bx_norm(z)**lambda_post)"
      neg_y: "-offset*vscale3*(bx_norm(z)**lambda_post)"

  - id: filter_stage3
    type: filter_element
    component: filter_stage3
    z_span_m: [0.782725, 1.042725]
    bounce_xpos_z_span_m: [0.782725, 0.978725]
    bounce_xneg_z_span_m: [0.782725, 0.978725]
    channel_ypos_z_span_m: [0.782725, 1.042725]
    channel_yneg_z_span_m: [0.782725, 1.042725]
    x_half_m: 0.055
    y_half_m: 0.040
    pcb_thickness_m: 0.001
    electrode_thickness_m: 0.0
    electrode_len_m: 0.016
    electrode_gap_m: 0.004
    end_gap_m: 0.0
    channels_x: 5
    channel_width_ratios: [1, 1, 1, 1, 1]
    channel_gap_m: 0.001
    corner_gap_m: 0.001
    voltages:
      bounce_xpos: "injection_bounce*(bx_norm(z)**0.5)"
      bounce_xneg: "injection_bounce*(bx_norm(z)**0.5)"
      channels_mode: uniform
      pos_y: "vscale3*(bx_norm(z)**lambda_post)"
      neg_y: "-offset*vscale3*(bx_norm(z)**lambda_post)"

  - id: filter_stage4
    type: filter_element
    component: filter_stage4
    z_span_m: [0.982725, 1.242725]
    bounce_xpos_z_span_m: [0.982725, 1.178725]
    bounce_xneg_z_span_m: [0.982725, 1.178725]
    channel_ypos_z_span_m: [0.982725, 1.242725]
    channel_yneg_z_span_m: [0.982725, 1.242725]
    x_half_m: 0.055
    y_half_m: 0.050
    pcb_thickness_m: 0.001
    electrode_thickness_m: 0.0
    electrode_len_m: 0.016
    electrode_gap_m: 0.004
    end_gap_m: 0.0
    channels_x: 5
    channel_width_ratios: [1, 1, 1, 1, 1]
    channel_gap_m: 0.001
    corner_gap_m: 0.001
    voltages:
      bounce_xpos: "injection_bounce*(bx_norm(z)**0.5)"
      bounce_xneg: "injection_bounce*(bx_norm(z)**0.5)"
      channels_mode: uniform
      pos_y: "vscale3*(bx_norm(z)**lambda_post)"
      neg_y: "-offset*vscale3*(bx_norm(z)**lambda_post)"

  - id: filter_stage5
    type: filter_element
    component: filter_stage5
    z_span_m: [1.182725, 1.442725]
    bounce_xpos_z_span_m: [1.182725, 1.378725]
    bounce_xneg_z_span_m: [1.182725, 1.378725]
    channel_ypos_z_span_m: [1.182725, 1.442725]
    channel_yneg_z_span_m: [1.182725, 1.442725]
    x_half_m: 0.055
    y_half_m: 0.060
    pcb_thickness_m: 0.001
    electrode_thickness_m: 0.0
    electrode_len_m: 0.016
    electrode_gap_m: 0.004
    end_gap_m: 0.0
    channels_x: 5
    channel_width_ratios: [1, 1, 1, 1, 1]
    channel_gap_m: 0.001
    corner_gap_m: 0.001
    voltages:
      bounce_xpos: "injection_bounce*(bx_norm(z)**0.5)"
      bounce_xneg: "injection_bounce*(bx_norm(z)**0.5)"
      channels_mode: uniform
      pos_y: "vscale3*(bx_norm(z)**lambda_post)"
      neg_y: "-offset*vscale3*(bx_norm(z)**lambda_post)"

  - id: einzel
    type: einzel_lens
    component: einzel
    start_z_m: 1.442725
    inner_radius_m: 0.03
    wall_thickness_m: 0.001
    gap_m: 0.001
    lengths_mm: [25, 10, 50, 10, 25]
    potentials: [0, 4, -2.73, -3.5, -3.5]

  - id: analyzer
    type: electrostatic_analyzer
    component: analyzer
    inner_radius_m: 0.0561
    center_radius_m: 0.066
    outer_radius_m: 0.0759
    shell_thickness_m: 0.001
    pcb_thickness_m: 0.001
    x_span_m: [-0.08, 0.08]
    y_span_m: [-0.07, 0.15]
    entrance_slit_mm: [1, 8]
    exit_slit_mm: [20, 6]
    voltages:
      inner: -500
      outer: 0

sources:
  singles:
    - name_prefix: z2
      pitches: [20]
      phis: [0]
      energy_eV: 18600
      on_target_face: true
