schema_version: "1.0"
experiment:
  name: ptolemy_full_detector
constants:
  injection_bounce: -200
  inj_base_ch0: -2500
  inj_base_ch1: -2400
  inj_base_ch2: -2300
  inj_base_ch3: -1700
  inj_base_ch4: -1000
  vscale5: 50544.978810838584
  vscale4: 52566.77796327213
  vscale3: 54588.577115705666
  vscale2: 66719.37203030693
  vscale1: 80871.96609734173
  offset: 0.10
  lambda_target: 0.25
  lambda_post: 0.60
  z0_filter: -1.409275
  z_accel_end_pos: -1.009275
  z_accel_end_neg: -0.649275
  z_lambda_start: -0.409275

profiles:
  bx:
    file: data/lngs_3perm_asym_Bx.txt
    normalize: true

filter_element_defaults:
  filter_start_z_m: -1.557275
  pcb_thickness_m: 0.001
  electrode_thickness_m: 0.0
  electrode_len_m: 0.016
  electrode_gap_m: 0.004
  channel_gap_m: 0.001
  corner_gap_m: 0.001

geometry:
  - id: lngs_magnet
    type: lngs_magnet
    component: magnet
    material: Iron-PEC

  - id: target
    type: target
    component: target
    center_x_m: -0.253
    center_z_m: -1.302
    rotation_deg: 74.07
    magnet_radius_m: 0.01
    magnet_height_m: 0.005
    thickness_m: 0.001
    remanence_T: 1.5255
    voltage_inner: 18600
    voltage_catcher: 19000

  - id: parallel_drain
    type: parallel_drain
    component: parallel_drain
    ellipse_center:
      x_m: 0.0
      z_m: -1.302
    axes_m:
      a_m: 0.2482
      b_m: 0.2248
    offsets_m:
      inner: 0.04
      outer: 0.03
    y_at_plate_m: 0.020
    face_number: 11
    angles_deg: [15, 30, 45, 60, 90]
    potentials: [15000, 12000, 8000, 5000]
    angle_gap_deg: 1
    electrode_thickness_m: 0.001
    x_half_m: 0.055
    y_half_m: 0.020
    cutout_z_span_m: [-1.802, -1.302]
    material: PEC

  - id: filter_injection
    type: filter_element
    component: filter_injection
    n_electrodes_inclusive: [0, 6]
    include_termination_backplate: false
    x_half_m: 0.055
    y_half_m: 0.020
    channels_x: 5
    channel_width_ratios: [1, 1, 1, 1, 1]
    voltages:
      bounce_xpos: "injection_bounce"
      bounce_xneg: "injection_bounce"
      channels_mode: asymmetric
      pos_y_channels: ["2500", "2600", "2700", "3300", "4000"]
      neg_y_channels: ["-2500", "-2400", "-2300", "-1700", "-1000"]

  # Stage 1a: acceleration ramp (z(n) < z_accel_end_pos)
  - id: filter_stage1a
    type: filter_element
    component: filter_stage1
    n_electrodes_inclusive: [7, 26]
    include_termination_backplate: false
    x_half_m: 0.055
    y_half_m: 0.020
    channels_x: 5
    channel_width_ratios: [1, 1, 1, 1, 1]
    voltages:
      bounce_xpos: "injection_bounce"
      bounce_xneg: "injection_bounce"
      channels_mode: asymmetric
      pos_y_channels:
        - "vscale5 * (bx_norm(z(n))**(1 + (lambda_target-1)*max(0,min(1,(z(n) - z0_filter)/(z_accel_end_pos - z0_filter)))))"
        - "vscale4 * (bx_norm(z(n))**(1 + (lambda_target-1)*max(0,min(1,(z(n) - z0_filter)/(z_accel_end_pos - z0_filter)))))"
        - "vscale3 * (bx_norm(z(n))**(1 + (lambda_target-1)*max(0,min(1,(z(n) - z0_filter)/(z_accel_end_pos - z0_filter)))))"
        - "vscale2 * (bx_norm(z(n))**(1 + (lambda_target-1)*max(0,min(1,(z(n) - z0_filter)/(z_accel_end_pos - z0_filter)))))"
        - "vscale1 * (bx_norm(z(n))**(1 + (lambda_target-1)*max(0,min(1,(z(n) - z0_filter)/(z_accel_end_pos - z0_filter)))))"
      neg_y_channels:
        - "inj_base_ch0 + ((-offset*vscale5*bx_norm(z(n))) - inj_base_ch0)*max(0,min(1,(z(n) - z0_filter)/(z_accel_end_neg - z0_filter)))"
        - "inj_base_ch1 + ((-offset*vscale4*bx_norm(z(n))) - inj_base_ch1)*max(0,min(1,(z(n) - z0_filter)/(z_accel_end_neg - z0_filter)))"
        - "inj_base_ch2 + ((-offset*vscale3*bx_norm(z(n))) - inj_base_ch2)*max(0,min(1,(z(n) - z0_filter)/(z_accel_end_neg - z0_filter)))"
        - "inj_base_ch3 + ((-offset*vscale2*bx_norm(z(n))) - inj_base_ch3)*max(0,min(1,(z(n) - z0_filter)/(z_accel_end_neg - z0_filter)))"
        - "inj_base_ch4 + ((-offset*vscale1*bx_norm(z(n))) - inj_base_ch4)*max(0,min(1,(z(n) - z0_filter)/(z_accel_end_neg - z0_filter)))"

  # Stage 1b: target-lambda transport (z_accel_end_pos <= z(n) < z_accel_end_neg)
  - id: filter_stage1b
    type: filter_element
    component: filter_stage1
    n_electrodes_inclusive: [27, 44]
    include_termination_backplate: false
    x_half_m: 0.055
    y_half_m: 0.020
    channels_x: 5
    channel_width_ratios: [1, 1, 1, 1, 1]
    voltages:
      bounce_xpos: "injection_bounce"
      bounce_xneg: "injection_bounce"
      channels_mode: asymmetric
      pos_y_channels:
        - "vscale5 * (bx_norm(z(n))**lambda_target)"
        - "vscale4 * (bx_norm(z(n))**lambda_target)"
        - "vscale3 * (bx_norm(z(n))**lambda_target)"
        - "vscale2 * (bx_norm(z(n))**lambda_target)"
        - "vscale1 * (bx_norm(z(n))**lambda_target)"
      neg_y_channels:
        - "inj_base_ch0 + ((-offset*vscale5*bx_norm(z(n))) - inj_base_ch0)*max(0,min(1,(z(n) - z0_filter)/(z_accel_end_neg - z0_filter)))"
        - "inj_base_ch1 + ((-offset*vscale4*bx_norm(z(n))) - inj_base_ch1)*max(0,min(1,(z(n) - z0_filter)/(z_accel_end_neg - z0_filter)))"
        - "inj_base_ch2 + ((-offset*vscale3*bx_norm(z(n))) - inj_base_ch2)*max(0,min(1,(z(n) - z0_filter)/(z_accel_end_neg - z0_filter)))"
        - "inj_base_ch3 + ((-offset*vscale2*bx_norm(z(n))) - inj_base_ch3)*max(0,min(1,(z(n) - z0_filter)/(z_accel_end_neg - z0_filter)))"
        - "inj_base_ch4 + ((-offset*vscale1*bx_norm(z(n))) - inj_base_ch4)*max(0,min(1,(z(n) - z0_filter)/(z_accel_end_neg - z0_filter)))"

  # Stage 1c: target-lambda drift (z_accel_end_neg <= z(n) < z_lambda_start)
  - id: filter_stage1c
    type: filter_element
    component: filter_stage1
    n_electrodes_inclusive: [45, 56]
    include_termination_backplate: false
    x_half_m: 0.055
    y_half_m: 0.020
    channels_x: 5
    channel_width_ratios: [1, 1, 1, 1, 1]
    voltages:
      bounce_xpos: "injection_bounce*(bx_norm(z(n))**0.5)"
      bounce_xneg: "injection_bounce*(bx_norm(z(n))**0.5)"
      channels_mode: asymmetric
      pos_y_channels:
        - "vscale5 * (bx_norm(z(n))**lambda_target)"
        - "vscale4 * (bx_norm(z(n))**lambda_target)"
        - "vscale3 * (bx_norm(z(n))**lambda_target)"
        - "vscale2 * (bx_norm(z(n))**lambda_target)"
        - "vscale1 * (bx_norm(z(n))**lambda_target)"
      neg_y_channels:
        - "-offset*vscale5*bx_norm(z(n))"
        - "-offset*vscale4*bx_norm(z(n))"
        - "-offset*vscale3*bx_norm(z(n))"
        - "-offset*vscale2*bx_norm(z(n))"
        - "-offset*vscale1*bx_norm(z(n))"

  # Stage 1d: post-lambda transport (z(n) >= z_lambda_start)
  - id: filter_stage1d
    type: filter_element
    component: filter_stage1
    n_electrodes_inclusive: [57, 109]
    include_termination_backplate: false
    x_half_m: 0.055
    y_half_m: 0.020
    channels_x: 5
    channel_width_ratios: [1, 1, 1, 1, 1]
    voltages:
      bounce_xpos: "injection_bounce*(bx_norm(z(n))**0.5)"
      bounce_xneg: "injection_bounce*(bx_norm(z(n))**0.5)"
      channels_mode: asymmetric
      pos_y_channels:
        - "vscale5 * (bx_norm(z(n))**lambda_post)"
        - "vscale4 * (bx_norm(z(n))**lambda_post)"
        - "vscale3 * (bx_norm(z(n))**lambda_post)"
        - "vscale2 * (bx_norm(z(n))**lambda_post)"
        - "vscale1 * (bx_norm(z(n))**lambda_post)"
      neg_y_channels:
        - "-offset*vscale5*(bx_norm(z(n))**lambda_post)"
        - "-offset*vscale4*(bx_norm(z(n))**lambda_post)"
        - "-offset*vscale3*(bx_norm(z(n))**lambda_post)"
        - "-offset*vscale2*(bx_norm(z(n))**lambda_post)"
        - "-offset*vscale1*(bx_norm(z(n))**lambda_post)"

  - id: filter_stage2
    type: filter_element
    component: filter_stage2
    n_electrodes_inclusive: [107, 119]
    include_termination_backplate: false
    x_half_m: 0.055
    y_half_m: 0.030
    channels_x: 5
    channel_width_ratios: [1, 1, 1, 1, 1]
    voltages:
      bounce_xpos: "injection_bounce*(bx_norm(z(n))**0.5)"
      bounce_xneg: "injection_bounce*(bx_norm(z(n))**0.5)"
      channels_mode: uniform
      pos_y: "vscale3*(bx_norm(z(n))**lambda_post)"
      neg_y: "-offset*vscale3*(bx_norm(z(n))**lambda_post)"

  - id: filter_stage3
    type: filter_element
    component: filter_stage3
    n_electrodes_inclusive: [117, 129]
    include_termination_backplate: false
    x_half_m: 0.055
    y_half_m: 0.040
    channels_x: 5
    channel_width_ratios: [1, 1, 1, 1, 1]
    voltages:
      bounce_xpos: "injection_bounce*(bx_norm(z(n))**0.5)"
      bounce_xneg: "injection_bounce*(bx_norm(z(n))**0.5)"
      channels_mode: uniform
      pos_y: "vscale3*(bx_norm(z(n))**lambda_post)"
      neg_y: "-offset*vscale3*(bx_norm(z(n))**lambda_post)"

  - id: filter_stage4
    type: filter_element
    component: filter_stage4
    n_electrodes_inclusive: [127, 139]
    include_termination_backplate: false
    x_half_m: 0.055
    y_half_m: 0.050
    channels_x: 5
    channel_width_ratios: [1, 1, 1, 1, 1]
    voltages:
      bounce_xpos: "injection_bounce*(bx_norm(z(n))**0.5)"
      bounce_xneg: "injection_bounce*(bx_norm(z(n))**0.5)"
      channels_mode: uniform
      pos_y: "vscale3*(bx_norm(z(n))**lambda_post)"
      neg_y: "-offset*vscale3*(bx_norm(z(n))**lambda_post)"

  - id: filter_stage5
    type: filter_element
    component: filter_stage5
    n_electrodes_inclusive: [137, 149]
    include_termination_backplate: false
    x_half_m: 0.055
    y_half_m: 0.060
    channels_x: 5
    channel_width_ratios: [1, 1, 1, 1, 1]
    voltages:
      bounce_xpos: "injection_bounce*(bx_norm(z(n))**0.5)"
      bounce_xneg: "injection_bounce*(bx_norm(z(n))**0.5)"
      channels_mode: uniform
      pos_y: "vscale3*(bx_norm(z(n))**lambda_post)"
      neg_y: "-offset*vscale3*(bx_norm(z(n))**lambda_post)"

  - id: einzel
    type: einzel_lens
    component: einzel
    start_z_m: 1.442725
    inner_radius_m: 0.03
    wall_thickness_m: 0.001
    gap_m: 0.001
    lengths_mm: [25, 10, 50, 10, 25]
    potentials: [0, 4, -2.73, -3.5, -3.5]

  - id: analyzer
    type: electrostatic_analyzer
    component: analyzer
    inner_radius_m: 0.0561
    center_radius_m: 0.066
    outer_radius_m: 0.0759
    shell_thickness_m: 0.001
    pcb_thickness_m: 0.001
    center_z_m: 1.567725
    x_span_m: [-0.08, 0.08]
    y_span_m: [-0.07, 0.15]
    entrance_slit_mm: [1, 8]
    exit_slit_mm: [20, 6]
    voltages:
      inner: -500
      outer: 0

sources:
  singles:
    - name_prefix: z2
      pitches: [20]
      phis: [0]
      energy_eV: 18600
      on_target_face: true
  rings: []
