  #   - name_prefix: ring
  #     radii_m: [0.0045, 0.0055]
  #     inner_radius_m: 0.0
  #     lines: 32
  #     pitch_deg: 20
  #     pitch_spread_deg: 10
  #     phi_deg: 0
