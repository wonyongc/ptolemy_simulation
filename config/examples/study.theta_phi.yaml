schema_version: "1.0"
study_name: theta_phi_sweep
detector_config: detector.ptolemy_full.yaml
sim_config: sim.cst.ptolemy.yaml
run_config: run.della.yaml
output_root: generated/studies
run_name_template: "th{theta_deg}_phi{phi_deg}"
matrix:
  theta_deg: [10, 20, 30, 40, 50, 60, 70, 80]
  phi_deg: [0, 45, 90, 135, 180, 225, 270, 315]
overrides:
  detector:
    "/sources/singles/0/pitches/0": "$theta_deg"
    "/sources/singles/0/phis/0": "$phi_deg"
  sim: {}
  run: {}
