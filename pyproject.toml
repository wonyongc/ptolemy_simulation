[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ptolemy-simulation"
version = "0.1.0"
description = "Adapter-first PTOLEMY transmission simulation pipeline"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "PyYAML>=6.0",
  "Jinja2>=3.1",
  "numpy>=1.24",
  "matplotlib>=3.7"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.4",
  "mypy>=1.8"
]

[project.scripts]
ptolemy = "ptolemy_simulation.cli:main"

[tool.setuptools.packages.find]
include = ["ptolemy_simulation*"]

[tool.setuptools.package-data]
ptolemy_simulation = ["templates/**/*.j2"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.9"
strict = false
ignore_missing_imports = true
